[package]
name = "skrin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A typed, Rust-native embedded storage engine"
publish = false

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "maintenance"
harness = false

[[bench]]
name = "storage_scale"
harness = false

[[bench]]
name = "catalog"
harness = false

[[bench]]
name = "resources"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[[bench]]
name = "group_commit"
harness = false

[[bench]]
name = "snapshots"
harness = false

[[bench]]
name = "game_world"
harness = false

[dev-dependencies]
# Comparator only; Skrin's engine and public API do not depend on SQLite.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
