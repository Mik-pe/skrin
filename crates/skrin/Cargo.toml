[package]
name = "skrin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A typed, Rust-native embedded storage engine"
publish = false

[features]
default = ["derive"]
derive = ["dep:skrin-derive"]

[dependencies]
skrin-derive = { path = "../skrin-derive", optional = true }

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "maintenance"
harness = false

[[bench]]
name = "storage_scale"
harness = false

[[bench]]
name = "catalog"
harness = false

[[bench]]
name = "resources"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[[bench]]
name = "group_commit"
harness = false

[[bench]]
name = "snapshots"
harness = false

[[bench]]
name = "game_world"
harness = false
required-features = ["derive"]

[[bench]]
name = "snapshot_build"
harness = false
required-features = ["derive"]

[[bench]]
name = "game_queries"
harness = false
required-features = ["derive"]

[dev-dependencies]
# Comparator only; Skrin's engine and public API do not depend on SQLite.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }

[[example]]
name = "accounts"
required-features = ["derive"]

[[example]]
name = "game_world"
required-features = ["derive"]

[[example]]
name = "game_queries"
required-features = ["derive"]
