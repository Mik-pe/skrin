name: Offline development toolchain
on:
  pull_request:
    paths: ['.github/workflows/dev-toolchain.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Package public source and toolchain, excluding credentials
        run: |
          mkdir -p "$RUNNER_TEMP/offline"
          git archive HEAD | gzip > "$RUNNER_TEMP/offline/source.tar.gz"
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/offline/rust.tar.gz" 1.89.0-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skrin-offline-dev
          path: ${{ runner.temp }}/offline/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
