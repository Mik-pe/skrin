name: Clean isolated validation artifacts
on:
  pull_request:
    paths: ['.github/workflows/cleanup-session.yml']
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'Mik-pe/skrin' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/bounded-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove only this branch's public toolchain exports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=Mik-pe/skrin
          gh api --paginate "repos/$repo/actions/workflows/377086703/runs?branch=agent%2Fbounded-maintenance&per_page=100" --jq '.workflow_runs[] | select(.status != "completed") | .id' > "$RUNNER_TEMP/session-runs"
          while read -r run; do
            gh api --method POST "repos/$repo/actions/runs/$run/cancel" || true
          done < "$RUNNER_TEMP/session-runs"
          for pass in 1 2 3; do
            gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "skrin-validation-environment" and .workflow_run.head_branch == "agent/bounded-maintenance") | .id' > "$RUNNER_TEMP/session-artifacts"
            while read -r artifact; do
              gh api --method DELETE "repos/$repo/actions/artifacts/$artifact"
            done < "$RUNNER_TEMP/session-artifacts"
            sleep 10
          done
