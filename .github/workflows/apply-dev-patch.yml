name: Materialize verified development patch
on:
  pull_request:
    paths: ['.github/workflows/apply-dev-patch.yml', '.dev-transfer/**']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Mik-pe/skrin' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/generations-and-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Validate and unpack the reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          expected = {
              'part0': '5a08cdc20832ecaabb1981908b5e6ca715d60a542604a71e00dd038763fca335',
              'part1': '209e4849ccad287620f9dc1151da347009e5213aaab4d862982d091892ee95b0',
              'part2': '4d6ec9fc90a829d82c79a63f3f7f97e752f86cbd012bfb8e12bd92c469435ae3',
              'part3': 'f33efa47e404d8add91f8b5023012c681db3771b4e4df925aa3e94df81690aa0',
              'part4': 'f43da630e21fa2eb281ba987b609ab3fc43a1b391ef5b76dd112e0b8b55fa6ab',
              'part5': '9ca175a7636d4bbf71651bd06c96f46d420feaa874c6d76c1e82f87e3a1ef171',
              'part6': '2e61389b6f72a791993225c915a420a69a779444e95be31dd16978bea4b5ddd5',
              'part7': '1c6ecace2420d777efbc3af37e4c8fb252b93a6070b4e019673dc96861370e7c',
          }
          parts = []
          for name, digest in expected.items():
              data = pathlib.Path('.dev-transfer', name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, name + ': transfer checksum mismatch'
              parts.append(data)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '3f98c481d823bd91d633f43c737b3471e4d3354688fbb0e2de07ae5e57fb3214'
          patch = lzma.decompress(compressed)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'skrin.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/skrin.patch"
          git apply --index "$RUNNER_TEMP/skrin.patch"
          git rm .dev-transfer/part[0-7]
          git diff --cached --check
      - name: Publish implementation without rewriting branch history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add verified managed generations, backup and offline migrations'
          git push origin HEAD:refs/heads/agent/generations-and-polish
