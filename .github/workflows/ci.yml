name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo +1.89.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Documentation
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --workspace --no-deps --locked
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: 1.89.0
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: 1.89.0
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustc +${{ matrix.rust }} -Vv
      - name: Tests
        run: cargo +${{ matrix.rust }} test --workspace --locked
      - name: Check all targets
        run: cargo +${{ matrix.rust }} check --workspace --all-targets --locked
      - name: Check engine without optional model derive
        run: |
          cargo +${{ matrix.rust }} check -p skrin --all-targets --no-default-features --locked
          cargo +${{ matrix.rust }} test -p skrin --doc --no-default-features --locked
      - name: Run in-memory example
        run: cargo +${{ matrix.rust }} run -p skrin --example accounts --locked
      - name: Run persistent example and verify reopen
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} run -p skrin --example accounts --locked -- "$RUNNER_TEMP/skrin-example-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.skrin"
      - name: Release tests
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} test --workspace --release --locked
      - name: Repeat parallel process and reopen regressions
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: |
          for iteration in $(seq 1 10); do
            echo "Release integration regression round $iteration"
            cargo +${{ matrix.rust }} test -p skrin --test api --test managed --test maintenance --test catalog --release --locked
          done
      - name: Smoke benchmark including synced commits
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench baseline --locked -- --durable "$RUNNER_TEMP"

      - name: Run complete managed lifecycle
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example lifecycle --locked -- "$RUNNER_TEMP/lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke benchmark including maintenance and verified reopen
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench maintenance --locked -- "$RUNNER_TEMP"

      - name: Run bounded maintenance lifecycle
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example maintenance --locked -- "$RUNNER_TEMP/bounded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke verified scale workload
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench storage_scale --locked -- "$RUNNER_TEMP" 10000
      - name: Run atomic multi-table workload and catalog migration
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example banking --locked -- "$RUNNER_TEMP/banking-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke equivalent-durability catalog workloads
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench catalog --locked -- "$RUNNER_TEMP" 1000

      - name: Smoke sustained maintenance and independent reopen metrics
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench resources --locked -- "$RUNNER_TEMP" 1000 3 128 100 --advisory-evict

      - name: Smoke required file-data reservations and verified reopen
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench resources --locked -- "$RUNNER_TEMP" 1000 3 128 100 --advisory-evict --reserve-file-data

      - name: Actual ENOSPC in an isolated bounded filesystem
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        env:
          SKRIN_TEST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          scripts/test-storage-full.sh --privileged-namespace
          scripts/test-storage-full.sh --release --privileged-namespace

      - name: Actual kernel OOM during production checkpoint verification
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        env:
          SKRIN_TEST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          scripts/test-memory-budget.sh --privileged-manager
          scripts/test-memory-budget.sh --release --privileged-manager

      - name: Run independent group commit, operation retry and managed lifecycle
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example group_commit --locked -- "$RUNNER_TEMP/groups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke equivalent immediate/group commit at low load and saturation
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: |
          for mode in immediate group; do
            cargo +${{ matrix.rust }} bench -p skrin --bench group_commit --locked -- "$RUNNER_TEMP" "$mode" 1 16 1000 1000
            cargo +${{ matrix.rust }} bench -p skrin --bench group_commit --locked -- "$RUNNER_TEMP" "$mode" 8 16 0 1000
          done

      - name: Run immutable snapshot admission and memory lifecycle
        run: cargo +${{ matrix.rust }} run -p skrin --example snapshots --locked
      - name: Run typed game-world frames and atomic saves
        run: cargo +${{ matrix.rust }} run -p skrin --example game_world --locked
      - name: Run signed game fields and typed character edits
        run: cargo +${{ matrix.rust }} run -p skrin --example game_models --locked
      - name: Run character models through WAL, checkpoint and backup recovery
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example game_models --locked -- "$RUNNER_TEMP/models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run typed game queries, filtered pages and coherent joins
        run: cargo +${{ matrix.rust }} run -p skrin --example game_queries --locked
      - name: Compare complete native and SQLite game journeys with fresh-process reopen
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench api_journey --locked
      - name: Verify the standalone SwiftData game journey
        if: matrix.os == 'macos-latest' && matrix.rust == 'stable'
        shell: bash
        run: |
          xcrun swiftc --version
          sw_vers
          xcrun swiftc -parse-as-library -module-cache-path "$RUNNER_TEMP/swiftdata-cache" comparisons/swiftdata_game.swift -o "$RUNNER_TEMP/swiftdata-game"
          "$RUNNER_TEMP/swiftdata-game" create "$RUNNER_TEMP/swiftdata-game.store"
          "$RUNNER_TEMP/swiftdata-game" verify "$RUNNER_TEMP/swiftdata-game.store"
      - name: Run game queries through WAL, checkpoint and backup recovery
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example game_queries --locked -- "$RUNNER_TEMP/queries-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify varied game queries against prepared covering SQLite controls
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        shell: bash
        run: |
          cargo +${{ matrix.rust }} bench -p skrin --bench game_queries --locked -- 1000
          cargo +${{ matrix.rust }} bench -p skrin --bench game_queries --locked -- 64 16
          cargo +${{ matrix.rust }} bench -p skrin --bench game_queries --locked -- 67 16 --sqlite-first
      - name: Smoke cursor seeking against an indexed prepared SQLite control
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench cursor_queries --locked -- 1000 16
      - name: Smoke resident snapshot conversion and exact retained-state checks
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: cargo +${{ matrix.rust }} bench -p skrin --bench snapshot_build --locked -- 1000
      - name: Run game-world save, backup and verified reopen
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example game_world --locked -- "$RUNNER_TEMP/world-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke equivalent durable game-world workloads
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: |
          for mode in native snapshot group_snapshot sqlite sqlite_bulk sqlite_batch; do
            for window in 1 8; do
              cargo +${{ matrix.rust }} bench -p skrin --bench game_world --locked -- "$RUNNER_TEMP" "$mode" 67 73 13 "$window"
            done
          done
      - name: Run snapshot pins, group retries, backup and offline migration
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: cargo +${{ matrix.rust }} run -p skrin --example snapshots --locked -- "$RUNNER_TEMP/snapshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Smoke equivalent durable writes with borrowed and snapshot readers
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.89.0'
        run: |
          for mode in immediate group snapshot group_snapshot; do
            cargo +${{ matrix.rust }} bench -p skrin --bench snapshots --locked -- "$RUNNER_TEMP" "$mode" 1 16 1000 1000 1 1000 1000
            cargo +${{ matrix.rust }} bench -p skrin --bench snapshots --locked -- "$RUNNER_TEMP" "$mode" 8 16 0 1000 2 1000 0
          done
